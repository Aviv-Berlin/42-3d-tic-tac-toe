services:
  database:
    build: backend/src/postgres
    image: ttt_database
    env_file:
      - backend/src/postgres/postgres.env
    secrets:
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - db_volume: /var/lib/postgresql/data
    networks:
      - ttt_network
    restart: always

secrets:
    db_password:
      file:./secrets/postgres-passwd

networks:
    ttt_network:
      name: ttt_network
      driver: bridge

volumes:
  db_volume:
    driver_opts:
      type: none
      o: bind
      device: ./db_volume