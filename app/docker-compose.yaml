services:
  database:
    build: backend/postgres
    image: ttt_database
    env_file:
      - backend/postgres/postgres.env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5432:5432"
  #  volumes:
   #   - db_volume:/var/lib/postgresql/data
    networks:
      - ttt_network
    restart: always

secrets:
    db_password:
      file: ./secrets/postgres-passwd

networks:
    ttt_network:
      name: ttt_network
      driver: bridge

