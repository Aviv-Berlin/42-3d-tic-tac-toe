services:
  frontend:
    build: frontend
    ports:
      - "8080:443"
    secrets:
      - ssl_key
      - ssl_cert
  backend:
    build: backend
    image: ttt_backend
    env_file:
      - backend/.env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "3001:3001"
    restart: always
  database:
    build: backend/postgres
    image: ttt_database
    env_file:
      - backend/postgres/postgres.env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

secrets:
    db_password:
      file: ./secrets/postgres-passwd
    ssl_key:
      file: ./secrets/ttt_nginx.key
    ssl_crt:
      file: ./secrets/ttt_nginx.crt

volumes:
  postgres_volume:
