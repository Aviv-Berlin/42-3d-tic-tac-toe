services:
  frontend:
    image: nginx:1.30.5-alpine-slim
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
  backend:
    build: backend
    image: ttt_backend
    env_file:
      - backend/.env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "3001:3001"
    restart: always
  database:
    build: backend/postgres
    image: ttt_database
    env_file:
      - backend/postgres/postgres.env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

secrets:
    db_password:
      file: ./secrets/postgres-passwd

volumes:
  postgres_volume:
